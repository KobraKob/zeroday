name: ZeroDay Data Pipeline Cron Jobs

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC (news-ingest & freshness)
    - cron: '0 3 * * 1' # Weekly on Monday at 03:00 UTC (policy-monitor)
    - cron: '0 4 * * 0' # Weekly on Sunday at 04:00 UTC (link-check)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to execute'
        required: true
        default: 'freshness'
        type: choice
        options:
          - news-ingest
          - policy-monitor
          - link-check
          - freshness

jobs:
  run-pipeline-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Pipeline Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx tsx scripts/jobs/run-job.ts ${{ github.event.inputs.job }}
          else
            npx tsx scripts/jobs/run-job.ts freshness
          fi
